name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n init.sh tests/init_test.sh
      - name: Test installer
        run: sh tests/init_test.sh
