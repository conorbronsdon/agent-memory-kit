name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: sh -n init.sh && sh -n tests/init_test.sh && sh -n tests/workflow_pins_test.sh
      - name: Test installer
        run: sh tests/init_test.sh
      - name: Check workflow pins and permissions
        run: sh tests/workflow_pins_test.sh
