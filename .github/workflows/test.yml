name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: sh -n init.sh && sh -n tests/init_test.sh && sh -n tests/workflow_pins_test.sh
      - name: Test installer
        run: sh tests/init_test.sh
      - name: Check workflow pins and permissions
        run: sh tests/workflow_pins_test.sh
